[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-products-pricer"
dynamic = ["version"]
description = "Monte Carlo and PDE pricing and risk analytics for autocallable notes and FCNs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carrey Chen" }]
keywords = [
    "autocallable",
    "fcn",
    "monte-carlo",
    "quantitative-finance",
    "snowball",
    "structured-products",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]
dev = [
    "build>=1.2,<2",
    "twine>=6,<7",
    "coverage[toml]>=7,<8",
    "pytest>=8,<10",
]

[project.scripts]
structured-products-pricer = "structured_products.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["structured_products*"]

[tool.setuptools.dynamic]
version = {attr = "structured_products._version.__version__"}

[tool.setuptools.package-data]
structured_products = ["py.typed", "data/*.json", "data/market_surface/*", "data/market_surface/templates/*"]

[project.urls]
Homepage = "https://github.com/carrey325/Autocall-pricing-and-risk-engine"
Documentation = "https://github.com/carrey325/Autocall-pricing-and-risk-engine/blob/main/docs/API.md"
Issues = "https://github.com/carrey325/Autocall-pricing-and-risk-engine/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.coverage.run]
branch = true
source = ["structured_products"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
