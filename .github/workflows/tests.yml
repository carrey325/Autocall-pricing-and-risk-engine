name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot]"

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report

      - name: Run examples
        run: |
          python examples/price_classic_snowball.py
          python examples/price_standard_fcn.py
          python examples/price_worst_of.py
          python examples/price_with_risk.py

      - name: Smoke-test CLI
        run: |
          for config in configs/*.json; do
            python main.py price --config "$config" --method mc --paths 200
          done
          python main.py compare --config configs/classic_snowball.json --paths 1000 --grid-size 201

      - name: Enforce clean-room tracked files
        run: |
          test -z "$(git ls-files '*.ipynb')"
          test -z "$(git grep -l -E 'legacy_adapter|exec\(' -- '*.py' || true)"

  distributions:
    name: installed package (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build wheel from source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test fresh wheel and source installations outside checkout
        run: python tools/verify_distribution.py --dist dist
      - name: Retain verified candidate artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-distributions
          path: dist/*
          retention-days: 14
